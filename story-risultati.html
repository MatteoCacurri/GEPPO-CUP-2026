<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Story Risultati — Geppo WC 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #040d0d;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 40px;
  gap: 12px;
  font-family: 'Barlow Condensed', sans-serif;
}

/* ── CONTROLS ── */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(420px, 94vw);
}

.controls select {
  flex: 1;
  background: #0a1818;
  color: #5edede;
  border: 1px solid #1a4a4a;
  padding: 9px 12px;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.88rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  outline: none;
}

.btn-dl {
  background: #5edede;
  color: #020f0f;
  border: none;
  padding: 9px 18px;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.88rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity .15s;
  flex-shrink: 0;
}
.btn-dl:active, .btn-dl:disabled { opacity: 0.6; }

.status {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #1a5a5a;
  text-align: center;
  min-height: 16px;
}

/* ── STORY WRAPPER (responsive container) ── */
.story-wrapper {
  width: min(420px, 94vw);
  position: relative;
  /* height set by JS */
}

/* ── STORY CANVAS 1080×1920 ── */
#story {
  width: 1080px;
  height: 1920px;
  transform-origin: top left;
  /* transform: scale() set by JS */
  position: absolute;
  top: 0;
  left: 0;
  overflow: hidden;
  background: linear-gradient(160deg, #091919 0%, #0c2020 30%, #112d2d 60%, #0c2020 100%);
  display: flex;
  flex-direction: column;
}

/* Grid texture — real div for html2canvas compat */
.s-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
  background-size: 64px 64px;
  pointer-events: none;
  z-index: 0;
}

/* Radial glow top-right */
.s-glow {
  position: absolute;
  top: -200px;
  right: -200px;
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, rgba(94,222,222,.08) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

/* Bottom glow */
.s-glow-b {
  position: absolute;
  bottom: -200px;
  left: -100px;
  width: 700px;
  height: 700px;
  background: radial-gradient(circle, rgba(94,222,222,.05) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

.s-inner {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.s-header {
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 52px 72px 44px;
  border-bottom: 1.5px solid rgba(94,222,222,.22);
}

.s-logo {
  width: 84px;
  height: 84px;
  object-fit: contain;
  flex-shrink: 0;
}

.s-brand { flex: 1; }

.s-brand-name {
  font-size: 2.8rem;
  font-weight: 900;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #e8f0f0;
  line-height: 1;
}

.s-brand-tag {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #2a8a8a;
  margin-top: 5px;
}

.s-season-badge {
  font-size: 2rem;
  font-weight: 900;
  color: #1a6a6a;
  border: 2px solid #1a4a4a;
  padding: 8px 22px;
  border-radius: 4px;
  letter-spacing: .05em;
  flex-shrink: 0;
}

/* ── TITLE AREA ── */
.s-title-area {
  padding: 58px 72px 44px;
}

.s-label {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #5edede;
  margin-bottom: 18px;
}

.s-dot {
  width: 10px;
  height: 10px;
  background: #5edede;
  border-radius: 50%;
  box-shadow: 0 0 14px #5edede;
  flex-shrink: 0;
}

.s-main-title {
  font-size: 10.5rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .02em;
  line-height: .88;
  color: #d8ecec;
}

.s-main-title .accent {
  color: #5edede;
  display: block;
  text-shadow: 0 0 80px rgba(94,222,222,.35);
}

.s-date-line {
  margin-top: 26px;
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #2a7a7a;
}

/* ── DIVIDER ── */
.s-divider {
  margin: 0 72px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(94,222,222,.25) 30%, rgba(94,222,222,.25) 70%, transparent);
}

/* ── MATCHES ── */
.s-matches {
  flex: 1;
  padding: 40px 72px 36px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.s-match {
  flex: 1;
  background: linear-gradient(135deg, rgba(9,28,28,.95), rgba(14,44,44,.75));
  border: 1px solid rgba(94,222,222,.16);
  border-left: 3px solid rgba(94,222,222,.35);
  border-radius: 14px;
  padding: 0 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 16px;
  position: relative;
  overflow: hidden;
}

.s-match-glow {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  pointer-events: none;
}
.s-match-glow.win-left  { background: linear-gradient(90deg, rgba(94,222,222,.07), transparent 50%); }
.s-match-glow.win-right { background: linear-gradient(270deg, rgba(94,222,222,.07), transparent 50%); }
.s-match-glow.draw      { background: radial-gradient(ellipse at center, rgba(232,255,0,.04), transparent 60%); }

.s-teams-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.s-team {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.s-team-flag { font-size: 5rem; line-height: 1; }

.s-team-name {
  font-size: 2.3rem;
  font-weight: 900;
  letter-spacing: .04em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.05;
  color: #7ab8b8;
}

.s-team.winner .s-team-name {
  color: #5edede;
  text-shadow: 0 0 28px rgba(94,222,222,.45);
}

.s-team.loser .s-team-name { color: #2a5a5a; }

.s-score-block {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.s-score {
  font-size: 6.2rem;
  font-weight: 900;
  line-height: 1;
  min-width: 88px;
  text-align: center;
  color: #aad8d8;
}

.s-score.win { color: #5edede; text-shadow: 0 0 40px rgba(94,222,222,.55); }
.s-score.lose { color: #1a4a4a; }

.s-separator { font-size: 3.5rem; font-weight: 700; color: #1a4a4a; }

.s-match-tag {
  text-align: center;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.s-match-tag.draw { color: #e8ff00; }
.s-match-tag.win-left  { color: #5edede; }
.s-match-tag.win-right { color: #5edede; }

/* ── FOOTER ── */
.s-footer {
  padding: 34px 72px 64px;
  border-top: 1px solid rgba(94,222,222,.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.s-hashtag {
  font-size: 1.55rem;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: #1a5a5a;
}

.s-g-badge {
  font-size: 1.3rem;
  font-weight: 900;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #5edede;
  border: 1.5px solid rgba(94,222,222,.4);
  padding: 8px 24px;
  border-radius: 4px;
}

/* ── NO RESULTS ── */
.s-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #1a5a5a;
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  text-align: center;
  gap: 24px;
}
.s-empty-icon { font-size: 5rem; opacity: .4; }
</style>
</head>

<script>
const FLAGS = {
  'ARGENTINA':'🇦🇷','BRASILE':'🇧🇷','FRANCIA':'🇫🇷','SPAGNA':'🇪🇸',
  'PORTOGALLO':'🇵🇹','GERMANIA':'🇩🇪','INGHILTERRA':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','ITALIA':'🇮🇹',
  'OLANDA':'🇳🇱','URUGUAY':'🇺🇾','COLOMBIA':'🇨🇴','JAMAICA':'🇯🇲',
  'MESSICO':'🇲🇽','USA':'🇺🇸','ALGERIA':'🇩🇿','MAROCCO':'🇲🇦',
  'NORVEGIA':'🇳🇴','SVIZZERA':'🇨🇭','GIAPPONE':'🇯🇵','SCOZIA':'🏴󠁧󠁢󠁳󠁣󠁴󠁿',
  'ECUADOR':'🇪🇨','COSTA D\'AVORIO':'🇨🇮','QATAR':'🇶🇦','NUOVA ZELANDA':'🇳🇿'
};
const DAYS   = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const MONTHS = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

let allPartite = [];

/* ── SCALE ── */
function scaleCanvas() {
  const wrapper = document.getElementById('wrapper');
  const story   = document.getElementById('story');
  const scale   = wrapper.offsetWidth / 1080;
  story.style.transform = `scale(${scale})`;
  wrapper.style.height  = (1920 * scale) + 'px';
}
window.addEventListener('resize', scaleCanvas);
scaleCanvas();

/* ── DATE HELPERS ── */
function parseDate(str) {
  if (!str) return null;
  const s = str.trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (m) {
    let y = m[3] ? +m[3] : new Date().getFullYear();
    if (y < 100) y += 2000;
    return { d: +m[1], mo: +m[2], y };
  }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return { d: +m[3], mo: +m[2], y: +m[1] };
  return null;
}

function formatDate(str) {
  const p = parseDate(str);
  if (!p) return str || '—';
  const dt = new Date(p.y, p.mo - 1, p.d);
  return `${DAYS[dt.getDay()]} ${p.d} ${MONTHS[p.mo - 1]} ${p.y}`;
}

function todayKey() {
  const t = new Date();
  return `${t.getDate()}/${t.getMonth()+1}/${t.getFullYear()}`;
}

function dateKey(p) { return `${p.d}/${p.mo}/${p.y}`; }

/* ── DATA LOAD ── */
async function loadData() {
  try {
    const res  = await fetch(`/api/sheet?range=${encodeURIComponent('Risultati!A:J')}`);
    const rows = (await res.json()).values || [];
    allPartite = rows.slice(1)
      .filter(r => r[2] && !isNaN(+r[0]))
      .map(r => ({
        giornata:  +r[0] || 1,
        data:       r[1] || '',
        casa:       (r[2] || '').trim().toUpperCase(),
        gol_casa:   r[3],
        gol_trasf:  r[5],
        trasferta: (r[6] || '').trim().toUpperCase()
      }));
    document.getElementById('statusBar').textContent =
      `${allPartite.length} partite caricate · seleziona giornata`;
    buildSelector();
    autoSelect();
  } catch (e) {
    document.getElementById('statusBar').textContent = 'Offline — dati demo';
    loadDemo();
  }
}

function loadDemo() {
  allPartite = [
    { giornata:1, data:'03/06/2026', casa:'MAROCCO',  gol_casa:'2', gol_trasf:'1', trasferta:'SVIZZERA' },
    { giornata:1, data:'03/06/2026', casa:'BRASILE',  gol_casa:'3', gol_trasf:'0', trasferta:'ARGENTINA' },
    { giornata:1, data:'03/06/2026', casa:'ECUADOR',  gol_casa:'1', gol_trasf:'1', trasferta:'MESSICO' },
    { giornata:2, data:'04/06/2026', casa:'SPAGNA',   gol_casa:'2', gol_trasf:'0', trasferta:'GERMANIA' },
    { giornata:2, data:'04/06/2026', casa:'NORVEGIA', gol_casa:'0', gol_trasf:'1', trasferta:'JAMAICA' },
    { giornata:2, data:'04/06/2026', casa:'ITALIA',   gol_casa:'1', gol_trasf:'2', trasferta:'OLANDA' },
  ];
  buildSelector();
  autoSelect();
}

/* ── SELECTOR ── */
function buildSelector() {
  const sel = document.getElementById('giornataSel');
  const map = {};
  allPartite.forEach(p => { if (!map[p.giornata]) map[p.giornata] = p.data; });

  sel.innerHTML = Object.entries(map)
    .sort((a,b) => +a[0] - +b[0])
    .map(([g, d]) => `<option value="${g}">G${g} — ${formatDate(d)}</option>`)
    .join('');

  sel.onchange = () => render(+sel.value);
}

function autoSelect() {
  const today = todayKey();
  const todayHit = allPartite.find(p => {
    const pd = parseDate(p.data);
    return pd && dateKey(pd) === today && hasResult(p);
  });

  if (todayHit) {
    document.getElementById('giornataSel').value = todayHit.giornata;
    render(todayHit.giornata);
    return;
  }

  // fallback: last giornata with results
  const withR = allPartite.filter(hasResult);
  if (withR.length) {
    const lastG = Math.max(...withR.map(p => p.giornata));
    document.getElementById('giornataSel').value = lastG;
    render(lastG);
  }
}

function hasResult(p) {
  return p.gol_casa !== '' && p.gol_casa !== undefined && p.gol_casa !== null && !isNaN(+p.gol_casa);
}

/* ── RENDER ── */
function render(gNum) {
  const partite = allPartite.filter(p => p.giornata === gNum && hasResult(p));
  const firstP  = allPartite.find(p => p.giornata === gNum);

  document.getElementById('storyDate').textContent = formatDate(firstP?.data || '');
  document.getElementById('storyG').textContent    = `G${gNum}`;

  const container = document.getElementById('storyMatches');

  if (!partite.length) {
    container.innerHTML = `
      <div class="s-empty">
        <div class="s-empty-icon">⚽</div>
        Nessun risultato
      </div>`;
    return;
  }

  container.innerHTML = partite.map(p => {
    const gc   = +p.gol_casa;
    const gt   = +p.gol_trasf;
    const draw = gc === gt;
    const cw   = gc > gt; // casa wins
    const tw   = gt > gc; // trasf wins

    const glowClass = draw ? 'draw' : cw ? 'win-left' : 'win-right';
    const tagClass  = draw ? 'draw' : cw ? 'win-left' : 'win-right';
    const tagText   = draw ? '⚡ PAREGGIO' : `⚽ ${cw ? p.casa : p.trasferta}`;

    return `
    <div class="s-match">
      <div class="s-match-glow ${glowClass}"></div>
      <div class="s-teams-row">

        <div class="s-team ${cw ? 'winner' : tw ? 'loser' : ''}">
          <div class="s-team-flag">${FLAGS[p.casa] || '🏳'}</div>
          <div class="s-team-name">${p.casa}</div>
        </div>

        <div class="s-score-block">
          <div class="s-score ${cw ? 'win' : tw ? 'lose' : ''}">${gc}</div>
          <div class="s-separator">—</div>
          <div class="s-score ${tw ? 'win' : cw ? 'lose' : ''}">${gt}</div>
        </div>

        <div class="s-team ${tw ? 'winner' : cw ? 'loser' : ''}">
          <div class="s-team-flag">${FLAGS[p.trasferta] || '🏳'}</div>
          <div class="s-team-name">${p.trasferta}</div>
        </div>

      </div>
      <div class="s-match-tag ${tagClass}">${tagText}</div>
    </div>`;
  }).join('');
}

/* ── DOWNLOAD ── */
async function downloadPNG() {
  const btn = document.getElementById('btnDl');
  btn.textContent = 'Generando…';
  btn.disabled    = true;

  // Temporarily remove transform so html2canvas captures at full res
  const story = document.getElementById('story');
  const saved = story.style.transform;
  story.style.transform = 'none';

  try {
    const canvas = await html2canvas(story, {
      width: 1080, height: 1920,
      scale: 1,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#091919',
      logging: false
    });

    const today = new Date().toLocaleDateString('it-IT').replace(/\//g, '-');
    const link  = document.createElement('a');
    link.download = `geppo-risultati-${today}.png`;
    link.href     = canvas.toDataURL('image/png');
    link.click();
  } catch (e) {
    alert('Errore export: ' + e.message);
  }

  story.style.transform = saved;
  btn.textContent = '⬇ PNG';
  btn.disabled    = false;
}

loadData();
</script>
